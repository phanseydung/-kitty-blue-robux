<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KITTY BLUE TOP UP - Premium Game Store</title>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Icon -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Kantumruy Pro', sans-serif;
        }

        body {
            background-color: #f0f8ff;
            color: #333;
            padding-bottom: 30px;
        }

        /* Header */
        header {
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            box-shadow: 0 2px 8px rgba(160, 200, 235, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-text {
            font-size: 16px;
            font-weight: 700;
            color: #5c9ece;
        }

        .logo-subtext {
            font-size: 10px;
            color: #88b0d3;
            text-transform: uppercase;
        }

        .header-icons {
            display: flex;
            gap: 15px;
            color: #5c9ece;
            font-size: 16px;
        }

        /* Banner */
        .banner-slider {
            width: 100%;
            margin: 12px 0;
            padding: 0 15px;
        }

        .banner-content {
            background: linear-gradient(135deg, #aed9e0, #87ceeb, #5c9ece);
            border-radius: 16px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(135, 206, 235, 0.3);
        }

        /* Section Title */
        .section-title {
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #3b7ca8;
        }

        .title-star { color: #87ceeb; }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 0 15px 15px 15px;
        }

        .game-card {
            background: #fff;
            border-radius: 16px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(160, 200, 235, 0.15);
            border: 1px solid #e1f0fa;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-icon-box {
            width: 65px;
            height: 65px;
            border-radius: 14px;
            background: #bce0fd;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 6px;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.5);
        }

        .game-name {
            font-size: 11px;
            font-weight: 600;
            color: #4a6fa5;
            margin-bottom: 6px;
        }

        .btn-topup {
            width: 100%;
            background: #7bb5e3;
            color: #fff;
            border: none;
            padding: 6px 0;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        /* QR Section */
        .qr-section {
            margin: 15px;
            padding: 18px;
            background: white;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 2px 10px rgba(160, 200, 235, 0.15);
            border: 1px solid #e1f0fa;
        }

        .qr-title {
            font-size: 15px;
            font-weight: 700;
            color: #3b7ca8;
            margin-bottom: 4px;
        }

        .qr-sub {
            font-size: 12px;
            color: #779ecb;
            margin-bottom: 15px;
        }

        .qr-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .qr-card {
            background: #f4f9fc;
            border: 1px solid #c8e2f5;
            border-radius: 14px;
            padding: 10px;
            width: 47%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr-header {
            background: #e21a1a;
            color: white;
            width: 100%;
            padding: 4px;
            border-radius: 6px 6px 0 0;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .qr-box {
            background: white;
            padding: 8px;
            border-radius: 0 0 6px 6px;
            border: 1px solid #ddd;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .qr-card-label {
            font-size: 11px;
            font-weight: bold;
            color: #3b7ca8;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div>
            <div class="logo-text">🐱 KITTY BLUE TOP UP</div>
            <div class="logo-subtext">PREMIUM GAME STORE</div>
        </div>
        <div class="header-icons">
            <i class="fa-solid fa-moon"></i>
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-bars"></i>
        </div>
    </header>

    <!-- Banner -->
    <div class="banner-slider">
        <div class="banner-content">
            <div style="text-align: center;">
                <p>🎀 KITTY BLUE STORE 🎀</p>
                <p style="font-size: 12px; font-weight: normal; margin-top: 4px;">សេវាកម្មរហ័ស ទាន់ចិត្ត ទំនុកចិត្ត ១០០%</p>
            </div>
        </div>
    </div>

    <!-- All Games -->
    <div class="section-title">
        <i class="fa-solid fa-star title-star"></i> ALL GAMES
    </div>
    
    <div class="games-grid">
        <!-- Roblox -->
        <div class="game-card">
            <div class="game-icon-box" style="background: #aed9e0;">
                <span style="font-size: 28px;">🎀</span>
            </div>
            <div class="game-name">Roblox</div>
            <button class="btn-topup">TOPUP</button>
        </div>

        <!-- MLBB -->
        <div class="game-card">
            <div class="game-icon-box" style="background: #9bc5ea;">
                <span style="font-size: 22px; font-weight: bold; color: white;">MLBB</span>
            </div>
            <div class="game-name">MLBB (KH)</div>
            <button class="btn-topup">TOPUP</button>
        </div>

        <!-- Free Fire -->
        <div class="game-card">
            <div class="game-icon-box" style="background: #87ceeb;">
                <span style="font-size: 20px; font-weight: bold; color: white;">FF</span>
            </div>
            <div class="game-name">FreeFire</div>
            <button class="btn-topup">TOPUP</button>
        </div>
    </div>

    <!-- 💳 KHQR PAYMENT SECTION -->
    <div class="qr-section">
        <div class="qr-title">💳 វិធីសាស្ត្រទូទាត់ប្រាក់ (KHQR)</div>
        <div class="qr-sub">គណនី៖ <b>Phan duong</b> (TrueMoney KHQR)</div>
        
        <div class="qr-container">
            <!-- USD QR -->
            <div class="qr-card">
                <div class="qr-header">KHQR</div>
                <div class="qr-box">
                    <i class="fa-solid fa-qrcode" style="font-size: 80px; color: #222;"></i>
                </div>
                <div class="qr-card-label">💵 ប្រាក់ដុល្លារ ($ USD)</div>
            </div>

            <!-- KHR QR -->
            <div class="qr-card">
                <div class="qr-header">KHQR</div>
                <div class="qr-box">
                    <i class="fa-solid fa-qrcode" style="font-size: 80px; color: #222;"></i>
                </div>
                <div class="qr-card-label">៛ ប្រាក់រៀល (៛ KHR)</div>
            </div>
        </div>
    </div>

</body>
</html>
